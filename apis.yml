name: Probe Information
description: >-
  Probe Information Services (Probe42) is an Indian company-intelligence and
  business-data platform that collects, cleans, and curates information on
  roughly one million Indian companies from 743 public-domain sources through a
  five-step verification process. Its products — Probe42 Business, Probe42
  Banking, and the Probe42 API — deliver company profiles, financials, director
  and charge data, and risk signals used by banks, NBFCs, fintechs, and sales
  teams for onboarding, KYC/due-diligence, credit assessment, and lead
  intelligence. The Probe42 API lets developers embed this company data directly
  inside their own applications. Surfaced as an Accel portfolio company and
  added to the API Evangelist network for enrichment; the public API surface is
  gated behind developer-portal authentication.
